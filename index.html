body{
    font-family:Arial,sans-serif;
    background:#f4f7fb;

    padding:20px;
    color:#222;
}

.container{
    max-width:900px;

    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 4px 20px rgba(0,0,0,0.1);

h1{

input[type="text"]{

}

button{
    background:#243b64;

    border:none;

    border-radius:8px;

button:hover{

}

.option{
    display:block;
    padding:14px;

}

.option:hover{

}

.progress{
    margin:20px 0;
    font-weight:bold;
}

.question{
    font-size:20px;
    font-weight:bold;
    margin:20px 0;
}

.result{
    text-align:center;
}

.result-box{
    background:#f0f5ff;
    padding:20px;
    border-radius:12px;
    margin:15px 0;
}

.topic-table{
    width:100%;

}

.topic-table th,
.topic-table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

.topic-table th{

.hidden{

}

.small{

</style>
</head>

/* =====================================================
   INITIALISE TOPICS
   ===================================================== */

function initialiseTopics(){

    topicStats = {};

    const topics = [
        "Number",
        "Ratio & Percentage",
        "Algebra",
        "Geometry",
        "Statistics & Probability",
        "Mathematical Reasoning"
    ];

    topics.forEach(topic => {

        topicStats[topic] = {
            attempted:0,
            correct:0
        };

    });
}


/* =====================================================
   START TEST
   ===================================================== */

function startTest(){

    studentName =
        document.getElementById("studentName").value.trim();

    if(studentName === ""){
        alert("Please enter your name.");
        return;
    }

    initialiseTopics();

    currentQuestionIndex = 0;
    currentDifficulty = 2;
    score = 0;
    usedQuestions = [];

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("testScreen")
        .classList.remove("hidden");

    showNextQuestion();
}


/* =====================================================
   SELECT ADAPTIVE QUESTION
   ===================================================== */

function chooseQuestion(){

    const available =
        questions.filter(q =>
            !usedQuestions.includes(q)
        );

    if(available.length === 0){
        return null;
    }

    /*
       Find topics with the fewest attempts.
       This ensures that the assessment samples
       different areas of mathematics.
    */

    let minimumAttempts =
        Math.min(
            ...available.map(q =>
                topicStats[q.topic]
                ? topicStats[q.topic].attempted
                : 0
            )
        );

    let topicCandidates =
        available.filter(q =>
            topicStats[q.topic].attempted ===
            minimumAttempts
        );

    /*
       Select the question closest to the
       current adaptive difficulty.
    */

    topicCandidates.sort((a,b) => {

        const differenceA =
            Math.abs(a.difficulty - currentDifficulty);

        const differenceB =
            Math.abs(b.difficulty - currentDifficulty);

        return differenceA - differenceB;

    });

    return topicCandidates[0];
}


/* =====================================================
   SHOW QUESTION
   ===================================================== */

function showNextQuestion(){

    if(currentQuestionIndex >= MAX_QUESTIONS){

        finishTest();

        return;
    }

    currentQuestion =
        chooseQuestion();

    if(!currentQuestion){

        finishTest();

        return;
    }

    usedQuestions.push(currentQuestion);

    document.getElementById("questionNumber")
        .textContent =
        currentQuestionIndex + 1;

    let html = "";

    html +=
        '<div class="question">' +
        currentQuestion.question +
        '</div>';

    currentQuestion.options.forEach(
        (option,index) => {

            html += `
            <label class="option">
                <input
                    type="radio"
                    name="answer"
                    value="${index}">
                ${option}
            </label>
            `;

        }
    );

    document.getElementById("questionArea")
        .innerHTML = html;
}


/* =====================================================
   SUBMIT ANSWER
   ===================================================== */

function submitAnswer(){

    const selected =
        document.querySelector(
            'input[name="answer"]:checked'
        );

    if(!selected){

        alert("Please select an answer.");

        return;
    }

    const selectedAnswer =
        Number(selected.value);

    const correct =
        selectedAnswer === currentQuestion.answer;

    const topic =
        currentQuestion.topic;

    topicStats[topic].attempted++;

    if(correct){

        score++;

        topicStats[topic].correct++;

        /*
           Increase difficulty after
           a correct response.
        */

        currentDifficulty =
            Math.min(
                5,
                currentDifficulty + 1
            );

    }else{

        /*
           Decrease difficulty after
           an incorrect response.
        */

        currentDifficulty =
            Math.max(
                1,
                currentDifficulty - 1
            );
    }

    currentQuestionIndex++;

    showNextQuestion();
}


/* =====================================================
   FINISH TEST
   ===================================================== */

function finishTest(){

    document.getElementById("testScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");

    const percentage =
        Math.round(
            (score / MAX_QUESTIONS) * 100
        );

    let placement = "";
    let interpretation = "";

    if(score <= 7){

        placement =
            "Foundation / Grade 7 Support";

        interpretation =
            "The student would benefit from strengthening core Grade 7 mathematical skills before progressing further.";

    }
    else if(score <= 11){

        placement =
            "Developing / Grade 7";

        interpretation =
            "The student demonstrates developing Grade 7 understanding and would benefit from further consolidation.";

    }
    else if(score <= 15){

        placement =
            "Secure Grade 7 → Grade 8";

        interpretation =
            "The student demonstrates a reasonably secure Grade 7 foundation with emerging Grade 8 readiness.";

    }
    else if(score <= 17){

        placement =
            "Grade 8 Ready";

        interpretation =
            "The student demonstrates strong understanding across the assessed areas and appears ready for Grade 8 work.";

    }
    else{

        placement =
            "Strong Grade 8 / Extension";

        interpretation =
            "The student demonstrates strong performance on the assessed Grade 7–8 mathematics skills.";

    }


    document.getElementById("finalScore")
        .textContent =
        "Score: " +
        score +
        " / " +
        MAX_QUESTIONS;

    document.getElementById("finalPercentage")
        .textContent =
        "Percentage: " +
        percentage +
        "%";

    document.getElementById("placement")
        .textContent =
        placement;

    document.getElementById("interpretation")
        .textContent =
        interpretation;


    displayTopicResults();

    sendToGoogleSheets(
        percentage,
        placement
    );
}


/* =====================================================
   DISPLAY TOPIC RESULTS
   ===================================================== */

function displayTopicResults(){

    const table =
        document.getElementById("topicResults");

    table.innerHTML = "";

    Object.keys(topicStats).forEach(topic => {

        const attempted =
            topicStats[topic].attempted;

        const correct =
            topicStats[topic].correct;

        let performance = "—";

        if(attempted > 0){

            performance =
                Math.round(
                    (correct / attempted) * 100
                ) + "%";

        }

        table.innerHTML += `
        <tr>
            <td>${topic}</td>
            <td>${correct}</td>
            <td>${attempted}</td>
            <td>${performance}</td>
        </tr>
        `;

    });
}


/* =====================================================
   SEND RESULTS TO GOOGLE SHEETS
   ===================================================== */

function sendToGoogleSheets(
    percentage,
    placement
){

    document.getElementById("savingMessage")
        .textContent =
        "Saving your result...";

    const data = {

        name:studentName,

        score:score,

        total:MAX_QUESTIONS,

        percentage:percentage,

        placement:placement,

        topics:topicStats,

        date:new Date().toLocaleString()

    };


    fetch(
        GOOGLE_SCRIPT_URL,
        {
            method:"POST",

            mode:"no-cors",

            headers:{
                "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:JSON.stringify(data)
        }
    )
    .then(() => {

        document.getElementById("savingMessage")
            .textContent =
            "Your result has been submitted.";

    })
    .catch(error => {

        console.error(error);

        document.getElementById("savingMessage")
            .textContent =
            "Your result is shown above.";

    });

}
